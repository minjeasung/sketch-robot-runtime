name: SNUCEM Humble add-on
on:
  push:
    branches: [codex/snucem-spray-addon]
  pull_request:
    paths: ['addons/snucem_spray/**', 'src/sketch_control/**', 'src/rbpodo_painting_control/**', 'web/**', '.github/workflows/snucem-humble.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 20
    env:
      ROS_DOMAIN_ID: '179'
      ROS_LOCALHOST_ONLY: '1'
      SNUCEM_ISOLATED_ROS_TEST: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      # ROS launch_testing eagerly imports unrelated tests during collection.
      # This suite uses normal pytest fixtures and real ROS directly.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated CI dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip python3-opencv ros-humble-moveit-msgs ros-humble-controller-manager-msgs ros-humble-control-msgs ros-humble-tf2-ros ros-humble-visualization-msgs
          python3 -m pip install -r addons/snucem_spray/requirements-humble.txt pytest==8.3.5 httpx==0.28.1
      - name: Real Humble import, initialization and regression checks
        run: |
          source /opt/ros/humble/setup.bash
          export PYTHONPATH="$PWD/addons/snucem_spray:$PWD/src/sketch_control:$PWD/src/rbpodo_painting_control:$PYTHONPATH"
          python3 -m pytest -q addons/snucem_spray/tests src/sketch_control/test/test_zed_spray_projection.py src/sketch_control/test/test_zed_spray_generation.py src/sketch_control/test/test_polygon_work_area.py src/rbpodo_painting_control/test/test_spray_eoat.py src/sketch_control/test/test_executor_plan_identity.py src/sketch_control/test/test_spray_motion_test.py src/sketch_control/test/test_contact_collision_acm.py src/sketch_control/test/test_multi_plane_spray.py
      - name: Compare legacy contact failures with the unchanged parent
        run: |
          source /opt/ros/humble/setup.bash
          git -c safe.directory="$PWD" fetch --depth=1 origin ebc36dd676602ad913a187b32762b3aedd15b88f
          mkdir -p "$RUNNER_TEMP/snucem-parent"
          git -c safe.directory="$PWD" archive ebc36dd676602ad913a187b32762b3aedd15b88f src | tar -x -C "$RUNNER_TEMP/snucem-parent"
          python3 scripts/check_snucem_baseline.py --baseline "$RUNNER_TEMP/snucem-parent" --current "$PWD" --reports /tmp/snucem-regression-reports
      - name: Build deterministic distribution
        run: python3 scripts/package_snucem_spray.py --output /tmp/snucem-spray-humble.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: snucem-spray-humble
          path: |
            /tmp/snucem-spray-humble.tar.gz*
            /tmp/snucem-regression-reports/
