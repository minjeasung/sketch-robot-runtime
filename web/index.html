<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스케치 작업</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="sketch.css" />
  <script src="js/roslib.min.js"></script>
</head>
<body class="sketch-page">
  <header class="app-header">
    <a class="brand" href="./" aria-label="스케치 작업 홈"><span class="brand-mark" aria-hidden="true">S</span><h1>스케치 작업</h1></a>
    <div class="header-actions">
      <div id="status" class="status connecting"><span class="dot"></span><span id="status-text">연결 중</span></div>
      <button id="btn-stop-robot" class="stop-button" disabled title="로봇에 작업 중단 요청">■ 작업 중단</button>
    </div>
  </header>

  <main class="workspace">
    <section class="drawing-panel" aria-label="작업 스케치">
      <div class="workflow-tabs" role="group" aria-label="작업 단계">
        <label><input type="radio" name="workflow-mode" value="target" checked /><span><b>1</b> 대상 선택</span></label>
        <label><input type="radio" name="workflow-mode" value="work_area" /><span><b>2</b> 작업영역</span></label>
        <label><input type="radio" name="workflow-mode" value="path" /><span><b>3</b> 경로·실행</span></label>
      </div>
      <div class="canvas-heading"><h2 id="view-card-title">ZED 카메라</h2><span id="sketch-strokes-count">0개 스케치</span></div>
      <div id="zed-wrap" class="zed-wrap">
        <canvas id="zed-canvas" width="1280" height="720"></canvas>
        <canvas id="sketch-canvas" width="1280" height="720" aria-label="카메라 영상 위에 작업 대상을 그리세요"></canvas>
        <div id="camera-empty" class="camera-empty"><span class="camera-icon" aria-hidden="true">▣</span><strong>카메라 연결 대기</strong><span>영상이 연결되면 이곳에서 스케치할 수 있습니다.</span></div>
      </div>
      <div class="drawing-toolbar">
        <div class="drawing-tools" role="group" aria-label="그리기 도구">
          <label><input type="radio" name="sketch-mode" value="freehand" checked /><span>자유선</span></label>
          <label><input type="radio" name="sketch-mode" value="line" /><span>직선</span></label>
          <label><input type="radio" name="sketch-mode" value="rect" /><span>사각형</span></label>
        </div>
        <div class="edit-tools"><button id="btn-undo">되돌리기</button><button id="btn-clear">모두 지우기</button></div>
      </div>
      <p id="workflow-hint" class="workflow-hint">작업할 대상을 둘러 그린 뒤 평면을 추출하세요.</p>
    </section>

    <aside class="task-panel" aria-label="작업 설정과 실행">
      <section class="task-section">
        <label class="field-label" for="process-mode">작업 방식</label>
        <select id="process-mode"><option value="paint">롤러 도장</option><option value="spray">내화뿜칠</option></select>
        <p id="process-mode-state" class="field-help">작업면에 접촉하여 도장합니다.</p>
        <div id="active-plane-field" hidden><label class="field-label" for="active-plane">작업할 평면</label><select id="active-plane" disabled><option value="">측정 후 선택</option></select></div>
      </section>

      <section id="target-actions" class="task-section">
        <h2>대상 평면</h2>
        <button id="btn-set-target" class="primary wide" disabled>평면 추출</button>
        <div id="plane-candidates" aria-label="측정할 평면 선택"></div>
        <p id="planes-status" class="field-help" aria-live="polite">대상을 그리면 평면을 추출할 수 있습니다.</p>
        <button id="btn-refine-planes" class="wide" disabled>선택한 면 측정</button>
      </section>

      <section id="work-area-actions" class="task-section" hidden>
        <h2>작업영역</h2>
        <p class="field-help">칠할 영역을 둘러 그리세요. 그리지 않으면 정면 영상 전체를 사용합니다.</p>
        <button id="btn-set-work-area" class="primary wide" disabled>작업영역 확정</button>
      </section>

      <section id="path-actions" class="task-section" hidden>
        <h2>작업 경로</h2>
        <button id="btn-fill-work-area" class="primary wide" disabled>영역 자동 채우기</button>
        <button id="btn-execute" class="wide secondary-action" disabled>그린 경로 사용</button>
      </section>

      <section class="task-section execution-section">
        <h2>실행</h2>
        <div class="execution-checks">
          <div><span>평면 측정</span><span id="painting-d405-state" class="state-pill unknown">대기</span></div>
          <div><span>경로 검증</span><span id="painting-plan-validation" class="state-pill unknown">대기</span></div>
        </div>
        <div class="free-space-panel" id="tare-confirmation" hidden>
          <label for="free-space-confirmed"><input id="free-space-confirmed" type="checkbox" /><span>접촉 전 F/T 영점 조정 승인<small>계획 간격 10 mm · 실측 최소 7 mm</small></span></label>
          <span id="free-space-state" class="state-pill bad">미승인</span>
        </div>
        <p id="execution-summary" class="execution-summary" role="status">로봇 연결을 기다리고 있습니다.</p>
        <p id="painting-abort-reason" class="abort-notice" role="alert" hidden></p>
        <button id="btn-run-robot" class="primary wide run-button" disabled>작업 시작</button>
      </section>
    </aside>
  </main>

  <details class="diagnostics">
    <summary>연결·진단</summary>
    <div class="diagnostics-body">
      <div class="diagnostic-heading"><span id="ws-url"></span><a href="setup.html">F/T 센서 설정 ↗</a></div>
      <p id="painting-blockers" class="status-detail"></p>
      <pre id="events" class="events"></pre>
    </div>
  </details>
  <script src="js/target_refine_gate.js"></script>
  <script src="js/app.js"></script>
  <script src="js/multi_surface.js"></script>
</body>
</html>
